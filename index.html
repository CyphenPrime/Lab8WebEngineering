<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Product Gallery</h1>

  <div class="grid">
    <div class="card">
      <img src="https://placehold.co/400x250?text=Product+1" alt="Product 1" />
      <h3>Wireless Mouse</h3>
      <p class="price">$25</p>
      <button>Buy Now</button>
    </div>

    <div class="card">
      <img src="https://placehold.co/400x250?text=Product+2" alt="Product 2" />
      <h3>Mechanical Keyboard</h3>
      <p class="price">$70</p>
      <button>Buy Now</button>
    </div>

    <div class="card">
      <img src="https://placehold.co/400x250?text=Product+3" alt="Product 3" />
      <h3>Headphones</h3>
      <p class="price">$55</p>
      <button>Buy Now</button>
    </div>

    <div class="card">
      <img src="https://placehold.co/400x250?text=Product+4" alt="Product 4" />
      <h3>Webcam</h3>
      <p class="price">$40</p>
      <button>Buy Now</button>
    </div>
  </div>
</body>
</html>
